<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lit Component Forge</title>
  <style>
    :root {
      --forge-color-black: #000;
      --forge-color-surface: #121314;
      --forge-color-surface-2: #1d1f21;
      --forge-color-line: #313233;
      --forge-color-rule: #272727;
      --forge-color-hairline: #ffffff1a;
      --forge-color-ink: #7d7d7d;
      --forge-color-chalk: #d9d9d9;
      --forge-color-white: #fff;
      --forge-color-accent: #96ff1e;
      --forge-color-accent-glow: #96ff1ea6;
      --forge-color-blue: #3b9aff;
      --forge-font-sans: system-ui, sans-serif;
      --forge-font-mono: ui-monospace, monospace;
      --forge-radius: 8px;
      --forge-space-2: .4rem;
      --forge-space-4: 1rem;
      --forge-space-6: 1.5rem;
      --forge-ease-out: cubic-bezier(0, 0, .2, 1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--forge-color-surface); color: var(--forge-color-chalk); font-family: var(--forge-font-sans); -webkit-font-smoothing: antialiased; line-height: 1.5; }
    main { max-width: 900px; margin: 0 auto; padding: 48px 24px; }
    h1 { font-size: 14px; letter-spacing: .2em; text-transform: uppercase; color: var(--forge-color-accent); font-weight: 400; font-family: var(--forge-font-mono); }
    p.lead { color: var(--forge-color-ink); font-size: 14px; margin-top: var(--forge-space-2); }
    form { display: flex; gap: 12px; margin: var(--forge-space-6) 0; }
    input { flex: 1; background: var(--forge-color-surface-2); border: 1px solid var(--forge-color-line); border-radius: var(--forge-radius); color: var(--forge-color-chalk); padding: 12px; font: inherit; transition: border-color .15s var(--forge-ease-out); }
    input:focus-visible { outline: 2px solid var(--forge-color-accent); outline-offset: 2px; }
    button { background: var(--forge-color-accent); color: var(--forge-color-black); border: 0; border-radius: var(--forge-radius); padding: 12px 20px; font: inherit; font-weight: 700; cursor: pointer; transition: box-shadow .15s var(--forge-ease-out); }
    button:hover { box-shadow: 0 0 0 4px var(--forge-color-accent-glow); }
    button:focus-visible { outline: 2px solid var(--forge-color-accent); outline-offset: 2px; }
    button:disabled { opacity: .4; cursor: default; box-shadow: none; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--forge-space-4); }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
    pre { background: var(--forge-color-black); border: 1px solid var(--forge-color-rule); border-radius: var(--forge-radius); padding: var(--forge-space-4); overflow: auto; font: 12px/1.5 var(--forge-font-mono); color: var(--forge-color-ink); min-height: 280px; }
    .preview { border: 1px solid var(--forge-color-rule); border-radius: var(--forge-radius); padding: var(--forge-space-4); min-height: 280px; background: var(--forge-color-surface-2); }
    .err { color: var(--forge-color-accent); font-size: 12px; min-height: 16px; margin-top: var(--forge-space-2); }
  </style>
  <script type="importmap">
    { "imports": { "lit": "https://cdn.jsdelivr.net/npm/lit@3/+esm", "lit/": "https://cdn.jsdelivr.net/npm/lit@3/" } }
  </script>
</head>
<body>
<main>
  <h1>Lit Component Forge</h1>
  <p class="lead">Describe un componente y lo genero con Lit, Shadow DOM y eventos personalizados.</p>

  <form id="f">
    <input id="prompt" placeholder="ej. tarjeta de transferencia con monto y cuenta destino" maxlength="300" required />
    <button id="go" type="submit">Generar</button>
  </form>
  <div class="err" id="err"></div>

  <div class="grid">
    <pre id="code">// el código generado aparece aquí</pre>
    <div class="preview" id="preview"></div>
  </div>
</main>

<script type="module">
  const form = document.getElementById('f');
  const btn = document.getElementById('go');
  const err = document.getElementById('err');
  const code = document.getElementById('code');
  const preview = document.getElementById('preview');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    btn.disabled = true;
    btn.textContent = '...';
    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: document.getElementById('prompt').value }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Error');

      code.textContent = data.source;
      // Vista previa: el componente se registra y se monta dentro del contenedor
      const blob = new Blob([data.source], { type: 'text/javascript' });
      const url = URL.createObjectURL(blob);
      const mod = await import(url);
      preview.innerHTML = '';
      preview.appendChild(document.createElement(data.tag));
    } catch (ex) {
      err.textContent = ex.message;
    } finally {
      btn.disabled = false;
      btn.textContent = 'Generar';
    }
  });
</script>
</body>
</html>
